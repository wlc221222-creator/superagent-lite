plugins {
    id 'com.android.application'
}

android {
    namespace 'io.superagent.lite'
    compileSdk 34

    defaultConfig {
        applicationId 'io.superagent.lite'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The UI strings are Chinese; pin the compiler encoding so the build does not
// depend on the host locale.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
