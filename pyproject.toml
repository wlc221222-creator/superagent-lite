[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superagent-lite"
version = "0.1.0"
description = "A local router/worker agent skeleton: route tasks to Claude Code or other workers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = []

[project.scripts]
superagent = "superagent_lite.cli:main"

[tool.setuptools.packages.find]
include = ["superagent_lite*"]
